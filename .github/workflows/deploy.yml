name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      light: ${{ steps.light.outputs.light }}
      code: ${{ steps.code.outputs.code }}
      deploy_base: ${{ steps.deploy_base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Superseded (cancelled while pending) or failed runs never deploy, so diff
      # deploy filters from the last successful run instead of the push's `before`.
      # light/code filters below prefer that SHA; if unresolved, fall back to
      # github.event.before (never pass base as an empty string alone).
      - name: Resolve last successful deploy commit
        id: deploy_base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main \
            --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty')" || {
            echo "::warning::Could not resolve last successful deploy; using push diff."
            sha=""
          }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: light
        with:
          base: ${{ steps.deploy_base.outputs.sha != '' && steps.deploy_base.outputs.sha || github.event.before }}
          filters: |
            light:
              - '.changeset/**'
              - 'CHANGELOG.md'
              - 'src/domain/device/changelog.ts'
              - 'README.md'
              - 'LICENSE'
              - 'LICENSE.md'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: code
        with:
          base: ${{ steps.deploy_base.outputs.sha != '' && steps.deploy_base.outputs.sha || github.event.before }}
          # every: ** plus negations — README-only must not set code=true
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!.changeset/**'
              - '!CHANGELOG.md'
              - '!src/domain/device/changelog.ts'
              - '!README.md'
              - '!LICENSE'
              - '!LICENSE.md'

  verify:
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.light == 'true' && needs.changes.outputs.code == 'false'
        with:
          node-version: 24
          cache: npm
      - name: Light-path verify (changelog-only)
        if: needs.changes.outputs.light == 'true' && needs.changes.outputs.code == 'false'
        run: |
          npm ci
          npm run release:check
      - uses: ./.github/actions/setup-rust-wasm
        if: needs.changes.outputs.code == 'true'
      - run: cargo fmt --all -- --check
        if: needs.changes.outputs.code == 'true'
      - run: cargo clippy --locked -p jetlag-geometry-kernel -- -D warnings
        if: needs.changes.outputs.code == 'true'
      - run: cargo test --locked -p jetlag-geometry-kernel
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      - run: npm run wasm:build
        if: needs.changes.outputs.code == 'true'
      - run: npm run test:coverage
        if: needs.changes.outputs.code == 'true'
      - run: npm run test:functions
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v4
        if: needs.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - run: npx playwright install --with-deps chromium
        if: needs.changes.outputs.code == 'true'
      - name: Cache Firebase emulators
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json', 'package-lock.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-
      - run: npx firebase emulators:exec --project demo-jetlag --only auth,firestore,storage "npm run test:e2e:gate-smoke"
        if: needs.changes.outputs.code == 'true'
      - run: npm run build
        if: needs.changes.outputs.code == 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.code == 'true' && failure()
        with:
          name: playwright-report-gate-smoke
          path: playwright-report

  build:
    runs-on: ubuntu-latest
    needs: [changes, verify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust-wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx wrangler deploy --dry-run

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [changes, build]
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      functions_deployed: ${{ steps.deploy_meta.outputs.functions_deployed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: changes
        with:
          base: ${{ needs.changes.outputs.deploy_base }}
          filters: |
            backend:
              - 'functions/**'
              - 'firestore.rules'
              - 'firestore.indexes.json'
              - 'storage.rules'
              - 'firebase.json'
              - 'scripts/deploy-production.mjs'
              - '.firebaserc'
              - 'src/services/billing/**'
              - 'src/routes/Premium.tsx'
              - 'src/services/admin/**'
              - 'src/hooks/admin/**'
              - 'src/components/admin/**'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.backend == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.backend == 'true'
      - name: Install Doppler CLI
        if: steps.changes.outputs.backend == 'true'
        uses: DopplerHQ/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          verify-doppler-config: false
      # Narrow allowlist only: never dump the full Doppler catalog into GITHUB_ENV
      # (unmasked job env shows up in later step logs).
      - name: Resolve GCP auth inputs
        id: gcp_auth
        if: steps.changes.outputs.backend == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          provider="$(doppler secrets get GCP_WORKLOAD_IDENTITY_PROVIDER --plain --config prd)"
          service_account="$(doppler secrets get GCP_SERVICE_ACCOUNT --plain --config prd)"
          echo "::add-mask::${provider}"
          echo "::add-mask::${service_account}"
          {
            echo "provider=${provider}"
            echo "service_account=${service_account}"
          } >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.changes.outputs.backend == 'true'
        with:
          workload_identity_provider: ${{ steps.gcp_auth.outputs.provider }}
          service_account: ${{ steps.gcp_auth.outputs.service_account }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        if: steps.changes.outputs.backend == 'true'
      - name: Deploy Firestore and Functions
        id: deploy
        if: steps.changes.outputs.backend == 'true'
        run: doppler run --config prd -- npm run deploy
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Normalize functions_deployed output
        id: deploy_meta
        if: always()
        env:
          FUNCTIONS_DEPLOYED: ${{ steps.deploy.outputs.functions_deployed }}
        run: echo "functions_deployed=${FUNCTIONS_DEPLOYED:-false}" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [changes, deploy-backend]
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: filter
        with:
          base: ${{ needs.changes.outputs.deploy_base }}
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'worker/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'vite.chunk-groups.ts'
              - 'vite.pwa.ts'
              - 'vite.resolve-shared.ts'
              - 'wrangler.jsonc'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'tailwind.css'
              - 'biome.json'
              - 'scripts/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/actions/setup-rust-wasm/**'
            functions:
              - 'functions/**'
      - name: Decide frontend deploy
        id: changes
        env:
          BACKEND_FUNCTIONS_DEPLOYED: ${{ needs.deploy-backend.outputs.functions_deployed }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
        run: |
          if [[ "$BACKEND_FUNCTIONS_DEPLOYED" == "true" || "$FRONTEND_CHANGED" == "true" ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup-rust-wasm
        if: steps.changes.outputs.frontend == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.frontend == 'true'
      - name: Install Doppler CLI
        if: steps.changes.outputs.frontend == 'true'
        uses: DopplerHQ/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          verify-doppler-config: false
      - name: Require functions deploy when callables changed
        if: steps.changes.outputs.frontend == 'true'
        env:
          FUNCTIONS_CHANGED: ${{ steps.filter.outputs.functions }}
          BACKEND_FUNCTIONS_DEPLOYED: ${{ needs.deploy-backend.outputs.functions_deployed }}
        run: |
          if [[ "$FUNCTIONS_CHANGED" == "true" ]]; then
            if [[ "$BACKEND_FUNCTIONS_DEPLOYED" != "true" ]]; then
              echo "::error::Push includes functions/ changes but Cloud Functions were not deployed. Deploy backend first."
              exit 1
            fi
          fi
      - name: Require App Check site key
        if: steps.changes.outputs.frontend == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          site_key="$(doppler secrets get VITE_FIREBASE_APP_CHECK_SITE_KEY --plain --config prd)"
          echo "::add-mask::${site_key}"
          if [ -z "${site_key}" ]; then
            echo "::error::VITE_FIREBASE_APP_CHECK_SITE_KEY is required for production builds."
            exit 1
          fi
      - name: Install Playwright Chromium
        if: steps.changes.outputs.frontend == 'true'
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        if: steps.changes.outputs.frontend == 'true'
        run: doppler run --config prd -- npm run build 2>&1 | tee build.log
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      - name: Verify source maps are not shipped
        if: steps.changes.outputs.frontend == 'true'
        run: |
          if find dist -name '*.map' -print -quit | grep -q .; then
            echo "::error::Source map files remain in dist after build."
            exit 1
          fi
          if [ -f dist/_redirects ]; then
            echo "::error::dist/_redirects conflicts with wrangler.jsonc SPA handling. Remove public/_redirects."
            exit 1
          fi
          if ! grep -qiE 'uploaded|source maps' build.log; then
            echo "::warning::Source map upload was not confirmed in build output."
          fi
      # Allowlist CLOUDFLARE_* only; mask before wrangler (no full-catalog doppler run / GITHUB_ENV dump).
      - name: Deploy to Cloudflare
        if: steps.changes.outputs.frontend == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          token="$(doppler secrets get CLOUDFLARE_API_TOKEN --plain --config prd)"
          account_id="$(doppler secrets get CLOUDFLARE_ACCOUNT_ID --plain --config prd)"
          echo "::add-mask::${token}"
          echo "::add-mask::${account_id}"
          export CLOUDFLARE_API_TOKEN="${token}"
          export CLOUDFLARE_ACCOUNT_ID="${account_id}"
          npx wrangler deploy
