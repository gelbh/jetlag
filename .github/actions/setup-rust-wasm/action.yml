name: Setup Rust + wasm-pack
description: Install stable Rust with wasm32 target and pinned wasm-pack for geometry mask builds

inputs:
  wasm-pack-version:
    description: wasm-pack release version (no leading v)
    required: false
    default: "0.13.1"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - name: Install wasm-pack
      shell: bash
      env:
        WASM_PACK_VERSION: ${{ inputs.wasm-pack-version }}
      run: |
        mkdir -p "$HOME/.cargo/bin"
        curl -fsSL "https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
          | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" \
            "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        wasm-pack --version
