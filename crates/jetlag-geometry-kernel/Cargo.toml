[package]
name = "jetlag-geometry-kernel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
geo = { version = "0.33.1", default-features = false, features = ["use-serde", "earcut"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
voronator = { version = "0.2.1", default-features = false }
wasm-bindgen = "0.2"

[dev-dependencies]
